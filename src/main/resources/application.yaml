spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: hanifali
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: eu-west-2
  bucket: hanif-portfolio-bucket

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.hanif.portfolioapi: DEBUG